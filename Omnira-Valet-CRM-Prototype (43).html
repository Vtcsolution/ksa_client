<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أومنيرا فاليه · نظام المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0E0D0B; --bg2:#14120F; --panel:#1B1813; --panel2:#211D17; --panel3:#272119;
  --line:#3A3327; --line2:#4A4133;
  --gold:#C68B48; --gold-l:#E4BE85; --gold-d:#9A6B32; --gold-bg:rgba(198,139,72,.12);
  --cream:#F5F0E8; --cream2:#E7DECF; --muted:#A89B87; --soft:#8B7F6C;
  --ok:#7BA67B; --ok-bg:rgba(123,166,123,.14); --ok-d:#5A8A5A;
  --blue:#6B93C8; --blue-bg:rgba(107,147,200,.14);
  --purple:#9B7FC0; --purple-bg:rgba(155,127,192,.14);
  --teal:#5DA6A0; --teal-bg:rgba(93,166,160,.14);
  --danger:#C86B5A; --danger-bg:rgba(200,107,90,.14); --danger-l:#E39685;
  --warn:#D4A24E; --warn-bg:rgba(212,162,78,.14);
  --font-disp:'El Messiri',serif; --font-body:'Tajawal',sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-body);color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-d)}

/* ===== LOGIN ===== */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%, #241f18 0%, var(--bg2) 45%, var(--bg) 100%);padding:20px}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:38px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold);margin:0 auto 14px}
.login-logo .name{font-family:var(--font-disp);font-weight:700;letter-spacing:.24em;font-size:15px;color:var(--gold-l)}
.login-logo .sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.05em}
.login-card h2{font-family:var(--font-disp);font-size:19px;text-align:center;margin-bottom:4px;color:var(--cream)}
.login-card .hint{font-size:11.5px;color:var(--soft);text-align:center;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;
  color:var(--cream);font-size:13px;transition:border .15s}
.field input:focus{outline:none;border-color:var(--gold-d)}
.btn-primary{width:100%;background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#231a0c;font-weight:700;
  font-size:14px;padding:12px;border-radius:10px;font-family:var(--font-disp);transition:transform .1s,filter .15s;margin-top:4px}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:scale(.985)}
.demo-accounts{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.demo-accounts .dtitle{font-size:10.5px;color:var(--soft);text-align:center;margin-bottom:10px;letter-spacing:.05em}
.demo-btn{width:100%;display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:11px;padding:10px 13px;margin-bottom:8px;transition:border .15s,background .15s;text-align:right}
.demo-btn:hover{border-color:var(--gold-d);background:var(--panel2)}
.demo-btn .av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.demo-btn .di{flex:1}
.demo-btn .di b{display:block;font-size:12.5px;color:var(--cream);font-family:var(--font-disp)}
.demo-btn .di span{font-size:10px;color:var(--muted)}
.demo-btn .dgo{font-size:15px;color:var(--gold);opacity:.6}

/* ===== APP SHELL ===== */
.topbar{flex:0 0 auto;height:58px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:50}
.topbar .brand{display:flex;align-items:center;gap:9px}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.topbar .brand .bn{font-family:var(--font-disp);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--gold-l)}
.topbar .brand .role-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;margin-right:4px}
.role-pill.mgr{background:var(--gold-bg);color:var(--gold-l);border:1px solid var(--gold-d)}
.role-pill.rep{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(107,147,200,.4)}
.topbar .user-area{display:flex;align-items:center;gap:12px}
.topbar .clock{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.topbar .uname{display:flex;align-items:center;gap:8px}
.topbar .uname .ua{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel2)}
.topbar .uname .un{font-size:12.5px;font-weight:700;font-family:var(--font-disp);color:var(--cream)}
.topbar .logout{font-size:11px;color:var(--muted);padding:6px 11px;border-radius:8px;border:1px solid var(--line);transition:.15s}
.topbar .logout:hover{border-color:var(--danger);color:var(--danger-l)}

.body-area{flex:1;display:flex;overflow:hidden}

/* sidebar (manager) */
.sidebar{flex:0 0 auto;width:210px;background:var(--panel);border-left:1px solid var(--line);
  padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;color:var(--muted);
  font-size:12.5px;font-weight:500;transition:.13s;text-align:right;width:100%}
.nav-item .ni{font-size:16px;width:20px;text-align:center;flex:0 0 auto}
.nav-item:hover{background:var(--panel2);color:var(--cream2)}
.nav-item.active{background:var(--gold-bg);color:var(--gold-l);font-weight:700}
.nav-item.active .ni{filter:none}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.nav-label{font-size:9.5px;color:var(--soft);padding:4px 13px;letter-spacing:.08em;font-weight:700;margin-top:4px}

.main{flex:1;overflow-y:auto;padding:22px 26px;background:radial-gradient(130% 100% at 100% 0%, #191510 0%, var(--bg) 55%)}
.main-narrow{max-width:920px;margin:0 auto}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--font-disp);font-size:23px;font-weight:700;color:var(--cream);line-height:1.2}
.ph .sub{font-size:12px;color:var(--muted);margin-top:3px}
.ph .actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:9px 15px;border-radius:10px;transition:.13s;white-space:nowrap}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#231a0c}
.btn.gold:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);border:1px solid var(--line2);color:var(--cream2)}
.btn.ghost:hover{border-color:var(--gold-d);color:var(--gold-l)}
.btn.sm{padding:7px 11px;font-size:11px}
.btn.danger{background:var(--danger-bg);border:1px solid rgba(200,107,90,.4);color:var(--danger-l)}
.btn.danger:hover{background:rgba(200,107,90,.22)}
.btn.blue{background:var(--blue-bg);border:1px solid rgba(107,147,200,.4);color:var(--blue)}
.btn.blue:hover{background:rgba(107,147,200,.24)}
.btn.green{background:var(--ok-bg);border:1px solid rgba(123,166,123,.4);color:var(--ok)}
.btn.green:hover{background:rgba(123,166,123,.24)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* cards / KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative;overflow:hidden}
.kpi.hl{background:linear-gradient(155deg,#241d13,#181510);border-color:var(--gold-d)}
.kpi .kt{font-size:11px;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.kpi .kt .ki{font-size:14px}
.kpi .kv{font-family:var(--font-disp);font-size:28px;font-weight:700;color:var(--cream);line-height:1}
.kpi.hl .kv{color:var(--gold-l)}
.kpi .ksub{font-size:10px;color:var(--soft);margin-top:6px}
.kpi .kv small{font-size:13px;color:var(--muted);font-weight:400}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.panel-h h3{font-family:var(--font-disp);font-size:15px;font-weight:700;color:var(--cream);display:flex;align-items:center;gap:8px}
.panel-h h3 .pi{font-size:16px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead th{text-align:right;font-size:10.5px;color:var(--gold-l);font-weight:700;padding:9px 12px;
  border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--cream2);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .name-cell{font-family:var(--font-disp);font-weight:700;color:var(--cream)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap}
.chip.new{background:var(--panel3);color:var(--cream2);border:1px solid var(--line2)}
.chip.contacted{background:var(--blue-bg);color:var(--blue)}
.chip.interested{background:var(--warn-bg);color:var(--warn)}
.chip.meeting{background:var(--purple-bg);color:var(--purple)}
.chip.won{background:var(--ok-bg);color:var(--ok)}
.chip.archived{background:var(--danger-bg);color:var(--danger-l)}
.chip.followup{background:var(--teal-bg);color:var(--teal)}
.chip.late{background:var(--danger-bg);color:var(--danger-l)}
.chip.verified{background:var(--ok-bg);color:var(--ok)}
.chip.review{background:var(--warn-bg);color:var(--warn)}
.chip.seg{background:var(--gold-bg);color:var(--gold-l)}
.chip.online{background:var(--purple-bg);color:var(--purple)}
.chip.inperson{background:var(--gold-bg);color:var(--gold-l)}

/* segmented control */
.seg-ctrl{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg-ctrl button{font-size:11px;font-weight:700;padding:6px 13px;border-radius:7px;color:var(--muted);transition:.13s}
.seg-ctrl button.on{background:var(--gold-bg);color:var(--gold-l)}

/* empty state */
.empty{text-align:center;padding:44px 20px;color:var(--soft)}
.empty .ei{font-size:34px;margin-bottom:12px;opacity:.5}
.empty h4{font-family:var(--font-disp);font-size:15px;color:var(--cream2);margin-bottom:5px}
.empty p{font-size:12px;max-width:36ch;margin:0 auto}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,5,4,.72);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:500px;
  max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:2}
.modal-head h3{font-family:var(--font-disp);font-size:16px;color:var(--cream);display:flex;align-items:center;gap:9px}
.modal-head .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:20px;transition:.13s}
.modal-head .x:hover{background:var(--panel2);color:var(--danger-l)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;position:sticky;bottom:0;background:var(--panel)}

/* forms in modal */
.frow{margin-bottom:14px}
.frow label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.frow input,.frow select,.frow textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);
  border-radius:9px;padding:10px 13px;color:var(--cream);font-size:12.5px;transition:border .15s}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--gold-d)}
.frow textarea{resize:vertical;min-height:60px}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow .hintline{font-size:10px;color:var(--soft);margin-top:5px}

/* option grid (radio-like) */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:11.5px;
  color:var(--cream2);transition:.13s;text-align:right;display:flex;align-items:center;gap:8px}
.opt:hover{border-color:var(--gold-d)}
.opt.sel{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-l);font-weight:700}
.opt .oi{font-size:14px}

/* toggle */
.toggle{width:38px;height:22px;border-radius:100px;background:var(--line2);position:relative;transition:.18s;flex:0 0 auto}
.toggle.on{background:var(--gold-d)}
.toggle::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:var(--cream);transition:.18s}
.toggle.on::after{right:calc(100% - 20px)}

/* proof thumbnails */
.proof-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pthumb{aspect-ratio:1;border-radius:10px;border:1px solid var(--line2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;background:var(--bg2);position:relative;overflow:hidden}
.pthumb .pei{font-size:22px}
.pthumb .pel{font-size:9px;color:var(--muted)}
.pthumb.filled{border-color:var(--ok-d);background:var(--ok-bg)}
.pthumb.filled .pei{filter:none}

/* timeline / activity log */
.timeline{position:relative;padding-right:16px}
.timeline::before{content:"";position:absolute;right:5px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;right:-14px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg)}
.tl-item .tl-time{font-size:10px;color:var(--soft);margin-bottom:2px}
.tl-item .tl-txt{font-size:11.5px;color:var(--cream2);line-height:1.5}
.tl-item .tl-txt b{color:var(--cream)}
.tl-item .tl-who{font-size:10px;color:var(--gold-l);font-weight:700}

/* progress bars */
.prog{height:8px;background:var(--bg2);border-radius:100px;overflow:hidden;margin-top:6px}
.prog .bar{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .4s}
.prog.ok .bar{background:linear-gradient(90deg,var(--ok-d),var(--ok))}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel2);border:1px solid var(--gold-d);border-radius:11px;padding:11px 18px;font-size:12.5px;
  color:var(--cream);box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;animation:toastin .25s}
.toast.ok{border-color:var(--ok-d)}
.toast.warn{border-color:var(--warn)}
@keyframes toastin{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* goal banner */
.goal-banner{background:linear-gradient(135deg,#241d13,#1b1712);border:1.5px solid var(--gold-d);border-radius:var(--r);padding:14px 17px;margin-bottom:16px}
.goal-banner .gb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.goal-banner .gb-title{font-family:var(--font-disp);font-size:14px;font-weight:700;color:var(--gold-l);display:flex;align-items:center;gap:8px}
.goal-banner .gb-nums{font-family:var(--font-disp);font-size:19px;font-weight:700;color:var(--cream)}
.goal-banner .gb-nums small{font-size:12px;color:var(--muted);font-weight:400}
.goal-banner .gb-sub{font-size:10.5px;color:var(--muted);margin-top:5px}

/* priority ladder */
.ladder{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.ladder .lad{display:flex;align-items:center;gap:12px;text-align:right;border-radius:11px;padding:12px 14px;border:1px solid var(--line2);background:var(--bg2);transition:.13s;width:100%}
.ladder .lad .li{font-size:19px;flex:0 0 auto}
.ladder .lad .lt{flex:1}
.ladder .lad .lt b{display:block;font-size:12.5px;color:var(--cream)}
.ladder .lad .lt span{font-size:10px;color:var(--muted)}
.ladder .lad .lrank{font-size:9px;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap;flex:0 0 auto}
.ladder .lad.l1{border-color:var(--gold-d);background:var(--gold-bg)}
.ladder .lad.l1 .lrank{background:var(--gold);color:#241a0c}
.ladder .lad.l2 .lrank{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(155,127,192,.4)}
.ladder .lad.l3 .lrank{background:var(--teal-bg);color:var(--teal);border:1px solid rgba(93,166,160,.4)}
.ladder .lad.l4{opacity:.7}
.ladder .lad.l4 .lrank{background:var(--danger-bg);color:var(--danger-l);border:1px solid rgba(200,107,90,.3)}
.ladder .lad:hover{border-color:var(--gold-d)}
.ladder .lad.sel{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.script-hint{background:var(--blue-bg);border:1px solid rgba(107,147,200,.3);border-radius:10px;padding:10px 13px;font-size:11px;color:var(--cream2);margin-bottom:12px;line-height:1.6}
.script-hint b{color:var(--blue)}

/* funnel */
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.funnel-row .fl{flex:0 0 128px;font-size:11px;color:var(--cream2);font-weight:600}
.funnel-row .fbar{height:27px;border-radius:7px;background:linear-gradient(90deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:flex-end;padding:0 9px;font-family:var(--font-disp);font-weight:700;font-size:12px;color:#241a0c;min-width:36px;transition:width .4s}
.funnel-row.fw .fbar{background:linear-gradient(90deg,var(--ok-d),var(--ok))}
.funnel-row .fpct{flex:0 0 auto;font-size:10px;color:var(--soft);white-space:nowrap}

/* ===== weekly report paper ===== */
.paper{background:#FDFBF6;color:#2A241C;border-radius:14px;padding:32px 36px;max-width:820px;margin:0 auto 20px;
  box-shadow:0 14px 48px rgba(0,0,0,.5)}
.paper .p-brand{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #C68B48;
  padding-bottom:12px;margin-bottom:18px}
.paper .p-brand .pb-r .pb-logo{font-family:var(--font-disp);font-weight:700;letter-spacing:.18em;font-size:13px;color:#9A6B32}
